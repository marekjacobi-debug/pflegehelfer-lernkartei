<title>Pflegehelfer Lernkartei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Kopfzeile mit Reitern, darunter eine Spalte (max. 980px). Übersicht = Karteikasten mit Fächern; Prüfung = Prüfungsbogen wie in der Schule. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --sunk:#e6ece9; --line:#cfd9d4;
  --ink:#15302a; --muted:#566a63; --accent:#0b6e5f; --accent-ink:#ffffff; --accent-soft:#d5ebe5;
  --good:#2f7d32; --good-soft:#dcefdc; --bad:#b23a2e; --bad-soft:#f6dedb; --warn:#9a6a00; --warn-soft:#f6ecd0;
  --b1:#c9d4cf; --b2:#a6c9bd; --b3:#6fae9b; --b4:#2f8c77; --b5:#0b6e5f; --mark:#fff0a8;
  --g-blau:#3d5a80; --g-blau-soft:#e2e8f1; --g-pink-soft:#f8e3ea;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a17; --surface:#16231f; --sunk:#1d2e29; --line:#2c413a;
  --ink:#e4efea; --muted:#9db3ab; --accent:#4cc3a8; --accent-ink:#06211b; --accent-soft:#173a32;
  --good:#7cc97f; --good-soft:#1c3320; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e3b54d; --warn-soft:#352b12;
  --g-blau:#9db8dc; --g-blau-soft:#1e2a3a; --g-pink-soft:#3a2230;
  --b1:#2c3d38; --b2:#2f5a4e; --b3:#3a8270; --b4:#45a68e; --b5:#4cc3a8; --mark:#5a4d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a17; --surface:#16231f; --sunk:#1d2e29; --line:#2c413a;
  --ink:#e4efea; --muted:#9db3ab; --accent:#4cc3a8; --accent-ink:#06211b; --accent-soft:#173a32;
  --good:#7cc97f; --good-soft:#1c3320; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e3b54d; --warn-soft:#352b12;
  --g-blau:#9db8dc; --g-blau-soft:#1e2a3a; --g-pink-soft:#3a2230;
  --b1:#2c3d38; --b2:#2f5a4e; --b3:#3a8270; --b4:#45a68e; --b5:#4cc3a8; --mark:#5a4d12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
.brand{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand small{color:var(--muted);font-size:.82rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs button{font:inherit;font-weight:700;font-size:.95rem;background:none;border:0;color:var(--muted);padding:10px 11px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
@media (max-width:520px){nav.tabs button{padding:10px 7px 12px;font-size:.85rem}.brand h1{font-size:1.25rem}}
button,select,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em;margin:28px 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:64ch}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.92rem;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:.84rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.neu{background:var(--accent-soft);color:var(--accent)}
.chip.erg{background:var(--warn-soft);color:var(--warn)}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.toolbar label{font-size:.85rem;color:var(--muted);font-weight:700}
select,input[type=text],input[type=search],textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.empty{color:var(--muted);text-align:center;padding:36px 10px}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.answer-row .btn{padding:11px 20px;font-size:1rem}
.btn.no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.yes{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
.done{text-align:center;max-width:560px;margin:30px auto}
.done .big{font-family:var(--f-display);font-weight:800;font-size:2.4rem}

/* Übersicht */
.summary{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:20px}
@media (max-width:720px){.summary{grid-template-columns:1fr}}
.today{display:flex;flex-direction:column;gap:12px}
.today .big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1}
.today .row{display:flex;flex-wrap:wrap;gap:8px}
.weak{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:.9rem;color:var(--muted)}
.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;height:110px;margin-top:6px}
.boxes .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.boxes .bar{width:100%;border-radius:4px 4px 0 0;min-height:3px}
.boxes .lab{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.1}
.boxes .n{font-size:.78rem}
.legend{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.lf{margin-top:30px}
.lf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.lf-head h2{margin:0}
.lf-head .mono{color:var(--muted);font-size:.85rem}
.lfe{margin-top:14px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.topic .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;color:var(--muted);margin-top:3px}
.topic .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stack{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--sunk);margin-top:8px;max-width:420px}
.stack span{display:block;height:100%}
@media (max-width:560px){.topic{grid-template-columns:1fr}.topic .acts{justify-content:flex-start}}
.statusline{font-size:.8rem;color:var(--muted);margin-top:30px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.newbanner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin-top:16px}

/* Karteikarten */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:18px}
.progressline{width:100%;max-width:640px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.card{width:100%;max-width:640px;min-height:300px;perspective:1400px;cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
.card-inner{position:relative;width:100%;min-height:300px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;display:grid}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(0,0,0,.35)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:transparent}
.face .kicker{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.face .q{font-family:var(--f-display);font-weight:600;font-size:1.45rem;line-height:1.25;flex:1;display:flex;align-items:center;text-wrap:balance}
.face .a{font-size:1.15rem;line-height:1.45;flex:1;display:flex;align-items:center}
.face .hint{font-size:.8rem;color:var(--muted)}
.lines{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);background-position:0 8px}
@media (prefers-reduced-motion:reduce){.card-inner{transition:none}}
.typebox{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
.typebox textarea{width:100%;min-height:90px;resize:vertical}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:100%;max-width:640px}
.compare>div{border-radius:10px;padding:12px 14px;background:var(--sunk);min-width:0}
.compare>div.sol{background:var(--accent-soft)}
@media (max-width:560px){.compare{grid-template-columns:1fr}}

/* Lernzettel */
.sheet-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;margin-top:20px}
@media (max-width:780px){.sheet-layout{grid-template-columns:1fr}}
.toc{display:flex;flex-direction:column;gap:2px;position:sticky;top:110px;align-self:start;max-height:calc(100vh - 130px);overflow:auto}
@media (max-width:780px){.toc{position:static;max-height:none}}
.toc .grp-rga{font-size:.78rem;color:var(--muted);margin:0 0 4px;line-height:1.3}
.toc .grp{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.toc button{text-align:left;background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--ink);cursor:pointer;font-size:.92rem}
.toc button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.toc button:hover{background:var(--sunk)}
.searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.searchbar input{flex:1;min-width:200px;padding:10px 14px;border-radius:999px}
.hits{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.hit{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.hit:hover{border-color:var(--accent)}
.hit .where{font-size:.78rem;color:var(--muted);font-weight:700}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.sheet h2{margin-top:0}
.sheet .sub{color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.sec{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 20px;padding:14px 0;border-top:1px solid var(--line);break-inside:avoid}
.sec h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--accent)}
.sec ul{margin:0;padding-left:18px;max-width:64ch}
.sec li{margin:2px 0}
@media (max-width:560px){.sec{grid-template-columns:1fr}}
.merk{background:var(--accent-soft);border-radius:10px;padding:12px 16px 12px 14px;margin:0 0 16px;border-left:4px solid var(--accent)}
.merk .label{color:var(--accent);margin-bottom:4px}
.merk ol{margin:0;padding-left:22px}.merk li{margin:3px 0;font-weight:700;max-width:64ch}
.esel{background:var(--warn-soft);border-radius:10px;padding:12px 16px 12px 14px;margin:0 0 16px;border-left:4px solid var(--warn)}
.esel .label{color:var(--warn);margin-bottom:4px}
.esel ul{margin:0;padding-left:20px}.esel li{margin:5px 0;max-width:68ch}.esel li b{display:block}.esel li span{color:var(--muted);font-size:.93rem}
.merkall .esel{margin-bottom:8px}.merkall .esel .label{text-transform:none;letter-spacing:0;font-size:.92rem}
.merkall .grpt{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:16px 0 6px}
.merkall .merk{margin-bottom:8px}.merkall .merk .label{text-transform:none;letter-spacing:0;font-size:.92rem}
.merkall button.lnk{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;text-align:left}
body.breit .wrap,body.breit .top-inner{max-width:1280px}
.sec.mitgrafik .bild{grid-column:2;margin-top:10px;display:grid;gap:12px;max-width:900px}
.sec.mitgrafik .bild .grafik{margin:0}
@media (max-width:560px){.sec.mitgrafik .bild{grid-column:1}}
.grafik{margin:6px 0 14px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);break-inside:avoid}
.grafik svg{display:block;width:100%;height:auto}
.grafik figcaption{font-size:.8rem;color:var(--muted);padding:6px 12px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grafik figcaption button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}
.note{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.9rem;margin-bottom:14px}
.sources{font-size:.8rem;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:10px;word-break:break-word}

/* Üben: Quiz, Lückentext, Zuordnen */
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.modes button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;min-width:150px;flex:1}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.modes b{display:block;font-family:var(--f-display);font-weight:600}
.modes span{font-size:.82rem;color:var(--muted)}
.quiz{max-width:700px;margin:10px auto 0}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.qbar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-bottom:18px}
.qbar span{display:block;height:100%;background:var(--accent)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.3;margin:0 0 16px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .letter{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);min-width:1.2em;padding-top:2px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--sunk);font-size:.95rem}
.explain b{color:var(--accent)}
.qnav{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.cloze{font-size:1.08rem;line-height:2.4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cloze input{width:9em;padding:2px 8px;border-radius:6px;border:0;border-bottom:2px solid var(--accent);background:var(--sunk);font-size:1rem}
.cloze input.right{background:var(--good-soft);border-bottom-color:var(--good)}
.cloze input.wrong{background:var(--bad-soft);border-bottom-color:var(--bad)}
.cloze .fix{font-size:.85rem;color:var(--good);font-weight:700;margin-left:4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.bank button{border:1px dashed var(--accent);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.92rem}
.bank button.used{opacity:.35;text-decoration:line-through}
.match{display:flex;flex-direction:column;gap:8px}
.match .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.match .pair.right{border-color:var(--good);background:var(--good-soft)}
.match .pair.wrong{border-color:var(--bad);background:var(--bad-soft)}
.match .pair b{font-weight:700}
.match select{width:100%}
.match .fix{grid-column:1/-1;font-size:.85rem;color:var(--good);font-weight:700}
@media (max-width:520px){.match .pair{grid-template-columns:1fr}}
.result-list{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:8px}
.result-list li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:.92rem;padding:8px 0;border-bottom:1px solid var(--line)}
.ok{color:var(--good);font-weight:700}.ko{color:var(--bad);font-weight:700}
.history{margin-top:24px}
.history table{border-collapse:collapse;width:100%;font-size:.88rem}
.history td,.history th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.history th{color:var(--muted);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.tablewrap{overflow-x:auto}

/* Prüfung */
.exam{max-width:760px;margin:16px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 26px 30px}
.exam-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:8px}
.exam-head h2{margin:0;font-size:1.4rem}
.exam-head .meta{font-size:.85rem;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:1.1rem;align-self:start}
.task{padding:18px 0;border-bottom:1px solid var(--line)}
.task-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px}
.task-h h3{font-size:1.05rem}
.pts{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.grade{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0 18px}
.grade .note{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;background:none;padding:0;margin:0}
.key{font-size:.82rem;color:var(--muted);text-align:center}
@media (max-width:520px){.exam{padding:18px 14px}}


/* Lehrplan */
.lp-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:620px){.lp-sum{grid-template-columns:1fr}}
.lp-sum .big{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1.05}
.lp-sum .sub{color:var(--muted);font-size:.88rem}
.lp-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--sunk);margin-top:10px}
.lp-bar span{display:block;height:100%}
.lp-lf{margin-top:30px}

/* Tags */

.fall{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;background:var(--surface);break-inside:avoid}

.chip.st1{background:var(--good-soft);color:var(--good)}.chip.st2{background:var(--warn-soft);color:var(--warn)}.chip.st3{background:var(--bad-soft);color:var(--bad)}

.fall details{margin-top:4px}.fall summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem}

/* Druck-Dialog */

@media (max-width:620px){.artwahl{grid-template-columns:1fr}}
.artwahl label{display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;position:relative}

.druck .info{font-size:.85rem;color:var(--muted)}
.druck .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

<script>
(function(){
"use strict";
var INTERVALS=[0,1,3,7,16,35];
var NEW_PER_SESSION=20;
var NOTEN=[[92,1],[81,2],[67,3],[50,4],[30,5],[0,6]]; // Prozent → Note (nach Notenschlüssel aus dem Arbeitsauftrag 63/58/51/42/32/19)
var OFFLINE=location.protocol==="file:";
var C=null, topics=[], TAGS=[], tagFilter=null, suche="", cardIndex={}, quizIndex={}, lueckIndex={}, zuIndex={};
var P={karten:{},quiz:{},luecken:{},zuordnen:{},verlauf:[],zuletzt:null};
var db=null, uid=null, saveTimer=null, saving=false, saveAgain=false, dl=null;
var LSKEY="pflegehelfer-lernkartei-v1";

function $(s,r){return (r||document).querySelector(s)}
function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];if(v===false||v==null)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}(kids||[]).forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function suchNorm(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/lernfeldeinheit|lfe/g,"lf ").replace(/lernfeld/g,"lf ").replace(/\blf\s*0?(\d)/g,"lf$1").replace(/\s+/g," ")}
function rgaEinheit(id){if(typeof LEHRPLAN==="undefined")return null;for(var i=0;i<LEHRPLAN.length;i++)for(var j=0;j<LEHRPLAN[i].e.length;j++)if(LEHRPLAN[i].e[j].id===id)return LEHRPLAN[i].e[j];return null}
function sucheAnwenden(){
  var w=suchNorm(suche).trim().split(" ").filter(Boolean),treffer=0,einheiten=0;
  document.querySelectorAll("#view-uebersicht .lf").forEach(function(lf){var lfSicht=false;
    lf.querySelectorAll(".lfe").forEach(function(eb){var eSicht=false;
      eb.querySelectorAll(".topic").forEach(function(t){var h=t.getAttribute("data-suche")||"";var ok=w.every(function(x){return h.indexOf(x)>=0});t.hidden=!ok;if(ok){eSicht=true;treffer++}});
      eb.hidden=!eSicht;if(eSicht){lfSicht=true;einheiten++}});
    lf.hidden=!lfSicht});
  var info=document.getElementById("suchinfo");
  if(info)info.textContent=!w.length?"":treffer?treffer+(treffer===1?" Thema":" Themen")+" in "+einheiten+(einheiten===1?" Lernfeldeinheit":" Lernfeldeinheiten"):"Keine Treffer. Probier z. B. „2.1“, „Mobilität“ oder „Hygiene“.";
}
function today(){return isoDay(new Date())}
function isoDay(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return isoDay(d)}
function fmtDate(s){if(!s)return"";var p=s.slice(0,10).split("-");return p[2]+"."+p[1]+"."+p[0]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().replace(/ß/g,"ss").replace(/selbstst/g,"selbst").replace(/[\s\-–.,;:!?„“"'()°%]/g,"")}
function lsGet(){try{var v=localStorage.getItem(LSKEY);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LSKEY,JSON.stringify(v))}catch(e){}}
function prefGet(k){try{return localStorage.getItem(LSKEY+":"+k)}catch(e){return null}}
function prefSet(k,v){try{localStorage.setItem(LSKEY+":"+k,v)}catch(e){}}
function noteFor(pct){for(var i=0;i<NOTEN.length;i++)if(pct>=NOTEN[i][0])return NOTEN[i][1];return 6}

/* ---------- Fortschritt ---------- */
function mergeProgress(a,b){
  var out={karten:{},quiz:{},luecken:{},zuordnen:{},verlauf:[],zuletzt:null};
  [a,b].forEach(function(x){if(!x)return;
    ["karten","quiz","luecken","zuordnen"].forEach(function(key){var src=x[key]||{};Object.keys(src).forEach(function(id){var c=src[id],o=out[key][id];if(!o||(c.t||0)>(o.t||0))out[key][id]=c})});
    (x.verlauf||[]).forEach(function(v){if(!out.verlauf.some(function(w){return w.t===v.t}))out.verlauf.push(v)});
    if(x.zuletzt&&(!out.zuletzt||x.zuletzt>out.zuletzt))out.zuletzt=x.zuletzt;
  });
  out.verlauf.sort(function(p,q){return q.t-p.t});out.verlauf=out.verlauf.slice(0,40);
  return out;
}
function touch(){P.zuletzt=new Date().toISOString();scheduleSave()}
function scheduleSave(){lsSet(P);if(!db||!uid)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500)}
function flush(){
  if(saving){saveAgain=true;return}saving=true;
  db.doc("data/users/"+uid+"/fortschritt").set(JSON.parse(JSON.stringify(P))).catch(function(){}).then(function(){saving=false;if(saveAgain){saveAgain=false;flush()}});
}
async function connectCaps(){
  if(!window.claude||!window.claude.use)return;
  try{dl=await window.claude.use("downloads")}catch(e){dl=null}
  if(dl&&current==="zettel"&&!searchQ)renderSheets();
  try{
    var u=await window.claude.use("user");var d=await window.claude.use("db");
    if(!u||!d)return;var id=await u.id();if(!id)return;
    db=d;uid=id;
    var snap=await db.doc("data/users/"+uid+"/fortschritt").get();
    if(snap.exists){P=mergeProgress(P,snap.data());lsSet(P)}
    else if(Object.keys(P.karten).length)scheduleSave();
    rerender();
  }catch(e){db=null}
}
function exportProgress(){
  var data=JSON.stringify({app:"pflegehelfer-lernkartei",exportiert:new Date().toISOString(),fortschritt:P},null,1);
  var name="Lernkartei-Fortschritt-"+today()+".json";
  if(dl){dl.save({filename:name,data:data}).catch(function(){});return}
  var a=el("a",{href:URL.createObjectURL(new Blob([data],{type:"application/json"})),download:name});document.body.appendChild(a);a.click();a.remove();
}
function importProgress(file){
  var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);var f=j.fortschritt||j;if(!f.karten)throw 0;P=mergeProgress(P,f);touch();rerender();flash("Fortschritt übernommen.")}catch(e){flash("Diese Datei ist keine gültige Fortschritts-Datei.")}};
  r.readAsText(file);
}
function flash(msg){var s=$("#flash");if(s){s.textContent=msg;setTimeout(function(){if(s)s.textContent=""},5000)}}

/* ---------- Inhalte ---------- */
function indexContent(){
  topics=[];cardIndex={};quizIndex={};lueckIndex={};zuIndex={};
  C.lernfelder.forEach(function(lf){lf.einheiten.forEach(function(e){e.themen.forEach(function(t){
    t._lf=lf;t._e=e;t.tags=t.tags||[];t.luecken=t.luecken||[];t.zuordnen=t.zuordnen||[];topics.push(t);
    t.karten.forEach(function(k){k._t=t;cardIndex[k.id]=k});
    t.quiz.forEach(function(q){q._t=t;quizIndex[q.id]=q});
    t.luecken.forEach(function(l){l._t=t;lueckIndex[l.id]=l;l._sol=[];l.text.replace(/\{\{(.+?)\}\}/g,function(_,w){l._sol.push(w)})});
    t.zuordnen.forEach(function(z){z._t=t;zuIndex[z.id]=z});
  })})});
  var seen={};TAGS=[];
  (C.tags||[]).forEach(function(x){var n=typeof x==="string"?x:x.name;if(!seen[n]){seen[n]=1;TAGS.push(n)}});
  topics.forEach(function(t){t.tags.forEach(function(n){if(!seen[n]){seen[n]=1;TAGS.push(n)}})});
  TAGS=TAGS.filter(function(n){return topics.some(function(t){return t.tags.indexOf(n)>=0})});
}
function tagCount(n){return topics.filter(function(t){return t.tags.indexOf(n)>=0}).length}
function inScope(t,scope){return scope==="alle"||scope==="lf:"+t._lf.id||scope==="t:"+t.id||(scope.slice(0,4)==="tag:"&&t.tags.indexOf(scope.slice(4))>=0)}
function collect(scope,key){return topics.filter(function(t){return inScope(t,scope)}).reduce(function(a,t){return a.concat(t[key])},[])}
function boxOf(id){var s=P.karten[id];return s?s.b:0}
function isDue(id){var s=P.karten[id];return s&&s.d<=today()}
function stats(cards){var r={n:cards.length,boxes:[0,0,0,0,0,0],due:0,neu:0};cards.forEach(function(k){var b=boxOf(k.id);r.boxes[b]++;if(b===0)r.neu++;else if(isDue(k.id))r.due++});return r}
function boxColor(b){return["var(--sunk)","var(--b1)","var(--b2)","var(--b3)","var(--b4)","var(--b5)"][b]}
function isNewTopic(t){var seen=prefGet("gesehen");return seen&&t.neu_seit&&t.neu_seit>seen}
function wrongQuiz(scope){return collect(scope,"quiz").filter(function(q){var s=P.quiz[q.id];return s&&!s.r})}
function weakCards(scope){return collect(scope,"karten").filter(function(k){var b=boxOf(k.id);return b===1||b===2})}
function scopeName(scope){if(scope==="alle")return"Alle Themen";if(scope.slice(0,4)==="tag:")return"Tag: "+scope.slice(4);if(scope.slice(0,3)==="lf:"){var lf=C.lernfelder.find(function(l){return"lf:"+l.id===scope});return lf?lf.titel:scope}var t=topics.find(function(x){return"t:"+x.id===scope});return t?t.titel:scope}
function scopeSelect(id,value,counter){
  var s=el("select",{id:id});
  s.appendChild(el("option",{value:"alle",text:"Alle Themen"}));
  if(TAGS.length){var tg=el("optgroup",{label:"Nach Tag (über alle Lernfelder)"});TAGS.forEach(function(n){tg.appendChild(el("option",{value:"tag:"+n,text:"# "+n+" ("+tagCount(n)+" Themen)"}))});s.appendChild(tg)}
  C.lernfelder.forEach(function(lf){
    s.appendChild(el("option",{value:"lf:"+lf.id,text:lf.titel+" (gesamt)"}));
    var g=el("optgroup",{label:lf.titel});
    lf.einheiten.forEach(function(e){e.themen.forEach(function(t){g.appendChild(el("option",{value:"t:"+t.id,text:e.id+" "+t.titel+(counter?" · "+counter(t):"")}))})});
    s.appendChild(g);
  });

/* ---------- Navigation ---------- */
var VIEWS=["uebersicht","karten","zettel","ueben","pruefung","lehrplan"],current="uebersicht";
function show(view){
  current=view;
  document.querySelectorAll("nav.tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.view===view?"true":"false")});
  VIEWS.forEach(function(v){$("#view-"+v).hidden=v!==view});
  document.body.classList.toggle("breit",view==="zettel");
  prefSet("tab",view);
  if(view==="uebersicht")renderOverview();
  if(view==="karten"&&!session)renderCardStart();

  if(view==="ueben"&&!practice)renderPracticeStart();

/* ---------- Übersicht ---------- */
function renderOverview(){
  var v=$("#view-uebersicht");v.textContent="";
  var all=collect("alle","karten"),st=stats(all);
  var mastered=st.boxes[4]+st.boxes[5];

  if(newTopics.length)v.appendChild(el("div",{class:"newbanner"},[el("strong",{text:newTopics.length+" neue Themen seit deinem letzten Besuch:"}),el("span",{text:newTopics.map(function(t){return t.titel}).join(", ")})]));
  var wq=wrongQuiz("alle"),wc=weakCards("alle");
  var lastExam=(P.verlauf||[]).find(function(h){return h.typ==="pruefung"});
  var left=el("div",{class:"panel today"},[
    el("div",{class:"label",text:"Heute dran"}),
    el("div",{},[el("span",{class:"big mono",text:String(todo)}),el("span",{text:" Karten",style:"color:var(--muted)"})]),
    el("div",{style:"color:var(--muted);font-size:.92rem",text:st.due+" fällige Wiederholungen · "+Math.min(st.neu,NEW_PER_SESSION)+" neue Karten (von "+st.neu+" ungelernten)"}),
    el("div",{class:"row"},[
      el("button",{class:"btn primary",onclick:function(){startSession("alle","faellig")},disabled:todo===0},["Jetzt lernen"]),
      el("button",{class:"btn",onclick:function(){show("pruefung")}},["Probeprüfung"])
    ]),
    (wq.length||wc.length)?el("div",{class:"weak"},[
      el("span",{text:"Schwächen:"}),
      wc.length?el("button",{class:"btn sm",onclick:function(){startSession("alle","schwach")}},[wc.length+" schwache Karten"]):null,
      wq.length?el("button",{class:"btn sm",onclick:function(){show("ueben");startQuiz("alle",wq.length,true)}},[wq.length+" falsche Quizfragen"]):null
    ]):null,
    lastExam?el("div",{class:"weak"},[el("span",{text:"Letzte Probeprüfung: Note "+lastExam.note+" ("+lastExam.r+"/"+lastExam.n+" Punkte, "+fmtDate(isoDay(new Date(lastExam.t)))+")"})]):null
  ]);
  var boxes=el("div",{class:"boxes"}),max=Math.max.apply(null,st.boxes.concat([1])),labels=["neu","Fach 1","Fach 2","Fach 3","Fach 4","Fach 5"];
  st.boxes.forEach(function(n,i){boxes.appendChild(el("div",{class:"col"},[el("span",{class:"n mono",text:String(n)}),el("span",{class:"bar",style:"height:"+Math.max(3,Math.round(n/max*70))+"px;background:"+boxColor(i)+(i===0?";border:1px dashed var(--line)":"")}),el("span",{class:"lab",text:labels[i]})]))});
  var right=el("div",{class:"panel"},[
    el("div",{class:"label",text:"Karteikasten"}),
    el("div",{},[el("span",{class:"mono",style:"font-size:1.4rem",text:Math.round(mastered/Math.max(1,st.n)*100)+" %"}),el("span",{style:"color:var(--muted)",text:" sicher (Fach 4–5) · "+st.n+" Karten"})]),
    boxes,
    el("p",{class:"legend",text:"Gewusste Karten rücken ein Fach weiter und kommen seltener (1, 3, 7, 16, 35 Tage). Nicht gewusste fallen zurück in Fach 1."})
  ]);
  v.appendChild(el("div",{class:"summary"},[left,right]));

}
