name: Lernkartei veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen (Daten bereinigt, Seite baut)
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Werkzeuge für Präsentationen (pptxgenjs, Chromium, Schriften)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito fonts-crosextra-caladea
          npm install -g --no-fund --no-audit pptxgenjs@4.0.1 playwright@1.49.1
          npx -y playwright@1.49.1 install --with-deps chromium
      - name: Präsentationen bauen
        run: ./praesentationen_bauen.sh
      - name: Seite bauen
        run: python3 bauen.py
      - name: Auf den Zweig gh-pages veröffentlichen
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Seite aus ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  veroeffentlichen:
    # Falls in den Einstellungen "Source: GitHub Actions" gewählt ist
    needs: bauen
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
